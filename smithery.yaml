startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      whale402TxHash:
        type: string
        description: "Optional prepaid Base USDC transaction hash (e.g. 0x...) for instant HTTP 402 credits"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/mcp/server.js'],
      env: config && config.whale402TxHash ? { WHALE402_TX_HASH: config.whale402TxHash } : {}
    })
